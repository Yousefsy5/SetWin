<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SetWin - Custom Software Installer</title>
    <style>
        :root {
            --primary: #0066cc;
            --dark: #1e293b;
            --light: #f8fafc;
            --border: #e2e8f0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 20px;
        }
        header h1 {
            margin: 0;
            color: var(--primary);
            font-size: 2.5rem;
        }
        header p {
            color: #64748b;
            margin-top: 5px;
        }
        .category-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin: 20px 0 10px 0;
            color: var(--dark);
        }
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .app-card {
            background: #ffffff;
            border: 1px solid var(--border);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .app-card:hover {
            border-color: var(--primary);
            background-color: #f1f5f9;
        }
        .app-card input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .action-area {
            text-align: center;
            margin-top: 30px;
        }
        .btn-generate {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-generate:hover {
            background-color: #0052a3;
        }
        .output-box {
            margin-top: 30px;
            display: none;
            text-align: left;
        }
        textarea {
            width: 100%;
            height: 80px;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #0f172a;
            color: #38bdf8;
            resize: none;
            box-sizing: border-box;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>SetWin</h1>
        <p>Select your favorite applications and deploy them instantly.</p>
    </header>

    <!-- Web Browsers Section -->
    <div class="category-title">Web Browsers</div>
    <div class="app-grid">
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="Google.Chrome">
            <span>Google Chrome</span>
        </label>
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="Mozilla.Firefox">
            <span>Mozilla Firefox</span>
        </label>
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="Brave.Brave">
            <span>Brave Browser</span>
        </label>
    </div>

    <!-- Utilities Section -->
    <div class="category-title">Utilities & Media</div>
    <div class="app-grid">
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="7zip.7zip">
            <span>7-Zip</span>
        </label>
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="VideoLAN.VLC">
            <span>VLC Media Player</span>
        </label>
        <label class="app-card">
            <input type="checkbox" class="app-checkbox" value="Discord.Discord">
            <span>Discord</span>
        </label>
    </div>

    <div class="action-area">
        <button class="btn-generate" onclick="buildInstaller()">Get SetWin Command</button>
    </div>

    <div class="output-box" id="resultArea">
        <strong>Run this command in Command Prompt (cmd) or PowerShell to install:</strong>
        <textarea id="commandOutput" readonly></textarea>
    </div>
</div>

<script>
    function buildInstaller() {
        const selectedApps = document.querySelectorAll('.app-checkbox:checked');
        const resultArea = document.getElementById('resultArea');
        const commandOutput = document.getElementById('commandOutput');

        if (selectedApps.length === 0) {
            alert("Please select at least one application to install.");
            resultArea.style.display = "none";
            return;
        }

        let ids = [];
        selectedApps.forEach(app => {
            ids.push(app.value);
        });

        // Constructs a chain of native commands
        // --silent completes installations without forcing the user to click through setup windows
        // --accept-package-agreements bypasses initial legal prompts automatically
        let finalCommand = "winget install " + ids.join(" --silent ; winget install ") + " --silent --accept-package-agreements";

        commandOutput.value = finalCommand;
        resultArea.style.display = "block";
    }
</script>

</body>
</html>
